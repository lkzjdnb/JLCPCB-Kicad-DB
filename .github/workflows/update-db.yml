name: "Update component database"

on:
  push:
    branches:
      - master
  schedule:
    # Run daily at 3 AM UTC
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  update-database:
    name: "Update component database"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Download source database
        run: |
          wget https://cdfer.github.io/jlcpcb-parts-database/jlcpcb-components.sqlite3

      - name: Install dependencies
        run: uv sync

      - name: Run generation script
        run: |
          uv run python generate_basic_library.py

      - name: Prepare deployment directory
        run: |
          mkdir deploy
          cp jlcpcb-basic-kicad.sqlite3 deploy/

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: deploy

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
